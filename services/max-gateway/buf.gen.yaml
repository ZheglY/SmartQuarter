version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: internal/gen
    opt:
      - paths=source_relative
      - Msmartquarter/identity/v1/identity.proto=github.com/ZheglY/SmartQuarter/services/max-gateway/internal/gen/smartquarter/identity/v1
      - Msmartquarter/issue/v1/issue.proto=github.com/ZheglY/SmartQuarter/services/max-gateway/internal/gen/smartquarter/issue/v1
      - Msmartquarter/community/v1/community.proto=github.com/ZheglY/SmartQuarter/services/max-gateway/internal/gen/smartquarter/community/v1
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1"]
    out: internal/gen
    opt:
      - paths=source_relative
      - Msmartquarter/identity/v1/identity.proto=github.com/ZheglY/SmartQuarter/services/max-gateway/internal/gen/smartquarter/identity/v1
      - Msmartquarter/issue/v1/issue.proto=github.com/ZheglY/SmartQuarter/services/max-gateway/internal/gen/smartquarter/issue/v1
      - Msmartquarter/community/v1/community.proto=github.com/ZheglY/SmartQuarter/services/max-gateway/internal/gen/smartquarter/community/v1
