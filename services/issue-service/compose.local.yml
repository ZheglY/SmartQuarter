name: smartquarter-issue-local
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: issue_test
      POSTGRES_USER: issue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:15432:5432"]
    volumes: [issue-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue -d issue_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: [issue-media:/data]
  issue-service:
    profiles: [app]
    build: .
    environment:
      APP_ENV: local
      GRPC_ADDR: ":8082"
      HTTP_ADDR: ":8083"
      DATABASE_URL: postgres://issue:${POSTGRES_PASSWORD}@postgres:5432/issue_test?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:19000
      S3_REGION: ru-central1
      S3_BUCKET: issue-test
      S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports: ["127.0.0.1:18082:8082", "127.0.0.1:18083:8083"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
volumes:
  issue-postgres:
  issue-media:
