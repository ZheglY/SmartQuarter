  request:
    path:
      id: ${issueId}
    body:
      chairman_note: '[DATA-API] Учебный пример, не направлять во внешние службы.'
  expected:
    statusCodes:
    - 201
    contentType: application/json
    requiredFields:
    - id
    - issue_id
    - body
    - version
    - status
    - source_snapshot
    bodySchema:
      type: object
      required:
      - status
      - version
      - body
      properties:
        status:
          const: DRAFT
        version:
          const: 1
        body:
          type: string
          minLength: 20
  timeoutMs: 10000
  repeatable: false
  dependsOn:
