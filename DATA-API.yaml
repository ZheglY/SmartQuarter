      title: '[DATA-API] Проверка освещения'
      body: 'Демонстрационное объявление: осмотр освещения в учебном подъезде. Реальные работы не запланированы.'
  expected:
    statusCodes:
    - 201
    contentType: application/json
    requiredFields:
    - id
    - title
    - body
    - status
    bodySchema:
      type: object
      required:
      - status
      properties:
        status:
          const: PUBLISHED
  timeoutMs: 10000
  repeatable: false
