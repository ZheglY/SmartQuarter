      properties:
        total_votes:
          const: 1
  timeoutMs: 10000
  repeatable: false
  dependsOn:
  - create-poll
- id: duplicate-vote
  name: Повторный голос отклонён
  method: POST
  path: /api/v1/polls/{id}/vote
  role: resident
  request:
    path:
      id: ${pollId}
    body:
      option_id: ${optionId}
  expected:
    statusCodes:
    - 409
    contentType: application/json
    requiredFields:
