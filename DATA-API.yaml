# DATA-API 1.0. Credentials supplied separately, never committed.
# Three distinct MAX accounts: resident (author), neighbor, chairman in one dedicated review house.
# S3 binary PUT/GET require the documented external step: tools/data-api/README.md.
# Dates are fixed for the 2026 review; update poll ends_at before June 2030.
# No DELETE API for issues/announcements/polls/initiatives: history remains in the review house.
schemaVersion: '1.0'
solution:
  name: Умный Квартал
api:
  baseUrl: https://maxhack.ru
  openapi: ./contracts/openapi/openapi.yaml
  defaultHeaders:
    Accept: application/json
    Content-Type: application/json
    Origin: https://maxhack.ru
checks:
- id: health
  name: Готовность приложения
  method: GET
  path: /api/v1/health
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - status
    bodySchema:
      type: object
      required:
      - status
      properties:
        status:
          const: ready
  timeoutMs: 10000
  repeatable: true
- id: anonymous-denied
  name: Вход обязателен
  method: GET
  path: /api/v1/me
  role: public
  expected:
    statusCodes:
    - 401
    contentType: application/json
    requiredFields:
    - error.code
    - error.request_id
  timeoutMs: 10000
  repeatable: true
- id: resident-context
  name: 'Профиль и активный дом: resident'
  method: GET
  path: /api/v1/me
  role: resident
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - user.id
    - active_house_id
    - memberships
    - houses
  timeoutMs: 10000
  repeatable: true
- id: neighbor-context
  name: 'Профиль и активный дом: neighbor'
  method: GET
  path: /api/v1/me
  role: neighbor
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - user.id
    - active_house_id
    - memberships
    - houses
  timeoutMs: 10000
  repeatable: true
- id: chairman-context
  name: 'Профиль и активный дом: chairman'
  method: GET
  path: /api/v1/me
  role: chairman
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - user.id
    - active_house_id
    - memberships
    - houses
  timeoutMs: 10000
  repeatable: true
- id: role-state
  name: Права жителя
  method: GET
  path: /api/v1/house-access
  role: resident
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - platform_admin
    - can_register_house
    - can_manage_active_house
    bodySchema:
      type: object
      required:
      - can_manage_active_house
      properties:
        can_manage_active_house:
          const: false
  timeoutMs: 10000
  repeatable: true
- id: chairman-state
  name: Права председателя выбранного дома
  method: GET
  path: /api/v1/house-access
  role: chairman
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - can_manage_active_house
    bodySchema:
      type: object
      required:
      - can_manage_active_house
      properties:
        can_manage_active_house:
          const: true
  timeoutMs: 10000
  repeatable: true
- id: resident-admin-denied
  name: Админка недоступна жителю
  method: GET
  path: /api/v1/admin/users
  role: resident
  request:
    query: {query: DATA-API}
  expected:
    statusCodes:
    - 403
    contentType: application/json
    requiredFields:
    - error.code
    - error.request_id
  timeoutMs: 10000
  repeatable: true
- id: issues
  name: Список заявок
  method: GET
  path: /api/v1/issues
  role: resident
  request:
    query:
      page_size: 20
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - items
    - next_page_token
  timeoutMs: 10000
  repeatable: true
- id: photo-upload
  name: Получение ссылки на загрузку фотографии
  method: POST
  path: /api/v1/uploads
  role: resident
  request:
    body:
      filename: stair-light.png
      mime_type: image/png
      size_bytes: 2093740
  expected:
    statusCodes:
    - 201
    contentType: application/json
    requiredFields:
    - upload_id
    - presigned_url
    - required_headers
    - expires_at
  timeoutMs: 10000
  repeatable: false
  extract:
    uploadId: $.upload_id
    uploadUrl: $.presigned_url
  description: До photo-complete загрузить scripts/demo-content/images/stair-light.png методом PUT по presigned_url
    с required_headers из этого ответа. Это внешний S3, не endpoint Gateway. tools/data-api/run_checks.py выполняет
    шаг автоматически; другому исполнителю нужен такой же hook или пауза. Cookie приложения в S3 не передаётся.
- id: photo-complete
  name: Проверка загруженного объекта
  method: POST
  path: /api/v1/uploads/{id}/complete
  role: resident
  request:
    path:
      id: ${uploadId}
    body: {}
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - id
    - status
    - size_bytes
    - sha256
    - issue_id
    bodySchema:
      type: object
      required:
      - status
      - issue_id
      properties:
        status:
          const: READY
        issue_id:
          type: 'null'
  timeoutMs: 10000
  repeatable: false
  dependsOn:
  - photo-upload
- id: create-issue
  name: Житель создаёт заявку с фотографией
  method: POST
  path: /api/v1/issues
  role: resident
  request:
    body:
      category: INFRASTRUCTURE
      description: '[DATA-API] Не работает освещение лестничной площадки. Демонстрационная заявка для технической
        проверки.'
      location_text: Учебный подъезд, второй этаж
      attachment_ids:
      - ${uploadId}
  expected:
    statusCodes:
    - 201
    contentType: application/json
    requiredFields:
    - id
    - house_id
    - created_by
    - status
    - confirmations_count
    bodySchema:
      type: object
      required:
      - status
      - confirmations_count
      properties:
        status:
          const: DETECTED
        confirmations_count:
          const: 0
  timeoutMs: 10000
  repeatable: false
  dependsOn:
  - photo-complete
  extract:
    issueId: $.id
- id: issue-details
  name: Фото и история созданной заявки
  method: GET
  path: /api/v1/issues/{id}
  role: resident
  request:
    path:
      id: ${issueId}
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - issue.id
    - attachments
    - timeline
    - confirmed_by_me
    bodySchema:
      type: object
      required:
      - attachments
      - confirmed_by_me
      properties:
        attachments:
          type: array
          minItems: 1
        confirmed_by_me:
          const: false
  timeoutMs: 10000
  repeatable: true
  dependsOn:
  - create-issue
- id: photo-download
  name: Подписанная ссылка на просмотр фото
  method: GET
  path: /api/v1/attachments/{id}/download-url
  role: resident
  request:
    path:
      id: ${uploadId}
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - url
    - expires_at
  timeoutMs: 10000
  repeatable: true
  dependsOn:
  - create-issue
  description: run_checks.py также скачивает файл без cookie и сравнивает байты с исходной фотографией; внешний
    GET не является endpoint Gateway.
- id: confirm-issue
  name: Другой житель подтверждает заявку
  method: POST
  path: /api/v1/issues/{id}/confirm
  role: neighbor
  request:
    path:
      id: ${issueId}
    body: {}
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - confirmation_count
    - confirmed_by_me
    bodySchema:
      type: object
      required:
      - confirmation_count
      - confirmed_by_me
      properties:
        confirmation_count:
          const: 1
        confirmed_by_me:
          const: true
  timeoutMs: 10000
  repeatable: false
  dependsOn:
  - create-issue
- id: duplicate-confirmation
  name: Повторное подтверждение не увеличивает счётчик
  method: POST
  path: /api/v1/issues/{id}/confirm
  role: neighbor
  request:
    path:
      id: ${issueId}
    body: {}
  expected:
    statusCodes:
    - 409
    contentType: application/json
    requiredFields:
    - error.code
    - error.request_id
  timeoutMs: 10000
  repeatable: true
  dependsOn:
  - confirm-issue
- id: resident-statement-denied
  name: Житель не формирует заявление
  method: POST
  path: /api/v1/issues/{id}/statement
  role: resident
  request:
    path:
      id: ${issueId}
    body: {}
