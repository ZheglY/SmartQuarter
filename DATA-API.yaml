- id: resident-poll-denied
  name: Житель не создаёт опрос
  method: POST
  path: /api/v1/polls
  role: resident
  request:
    body: &id001
      question: '[DATA-API] Какой срок учебного осмотра удобнее?'
      options:
      - Утро
      - Вечер
      ends_at: '2030-06-01T18:00:00Z'
  expected:
    statusCodes:
    - 403
    contentType: application/json
    requiredFields:
    - error.code
    - error.request_id
  timeoutMs: 10000
  repeatable: true
- id: create-poll
  name: Председатель создаёт опрос
  method: POST
  path: /api/v1/polls
  role: chairman
  request:
    body: *id001
  expected:
    statusCodes:
    - 201
    contentType: application/json
    requiredFields:
