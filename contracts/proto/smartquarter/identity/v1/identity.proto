syntax = "proto3";

package smartquarter.identity.v1;

option go_package = "github.com/ZheglY/SmartQuarter/services/identity-service/internal/gen/smartquarter/identity/v1;identityv1";

import "google/protobuf/timestamp.proto";

service IdentityService {
  rpc UpsertMaxUser(UpsertMaxUserRequest) returns (User);
  rpc GetUserContext(GetUserContextRequest) returns (UserContext);
  rpc GetMembership(GetMembershipRequest) returns (Membership);
  rpc ListMemberships(ListMembershipsRequest) returns (ListMembershipsResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_RESIDENT = 1;
  ROLE_CHAIRMAN = 2;
  ROLE_ADMIN = 3;
}

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_STATUS_ACTIVE = 1;
  MEMBERSHIP_STATUS_INACTIVE = 2;
}

message User {
  string id = 1;
  int64 max_user_id = 2;
  string display_name = 3;
  string username = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message House {
  string id = 1;
  string name = 2;
  string address = 3;
  string city = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Membership {
  string id = 1;
  string user_id = 2;
  string house_id = 3;
  Role role = 4;
  MembershipStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message UserContext {
  User user = 1;
  repeated House houses = 2;
  repeated Membership memberships = 3;
  string default_house_id = 4;
}

message UpsertMaxUserRequest {
  int64 max_user_id = 1;
  string display_name = 2;
  string username = 3;
}

message GetUserContextRequest {
  string user_id = 1;
}

message GetMembershipRequest {
  string user_id = 1;
  string house_id = 2;
}

message ListMembershipsRequest {
  string user_id = 1;
}

message ListMembershipsResponse {
  repeated Membership items = 1;
}

// House onboarding (additive contract).
enum HouseRegistrationStatus {
  HOUSE_REGISTRATION_STATUS_UNSPECIFIED = 0;
  HOUSE_REGISTRATION_STATUS_PENDING = 1;
  HOUSE_REGISTRATION_STATUS_APPROVED = 2;
  HOUSE_REGISTRATION_STATUS_REJECTED = 3;
  HOUSE_REGISTRATION_STATUS_CANCELLED = 4;
}
enum JoinRequestStatus {
  JOIN_REQUEST_STATUS_UNSPECIFIED = 0;
  JOIN_REQUEST_STATUS_PENDING = 1;
  JOIN_REQUEST_STATUS_APPROVED = 2;
  JOIN_REQUEST_STATUS_REJECTED = 3;
  JOIN_REQUEST_STATUS_CANCELLED = 4;
}
enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_STATUS_ACTIVE = 1;
  INVITATION_STATUS_EXPIRED = 2;
  INVITATION_STATUS_REVOKED = 3;
  INVITATION_STATUS_EXHAUSTED = 4;
}
enum ChairmanTransferStatus {
  CHAIRMAN_TRANSFER_STATUS_UNSPECIFIED = 0;
  CHAIRMAN_TRANSFER_STATUS_PENDING = 1;
  CHAIRMAN_TRANSFER_STATUS_ACCEPTED = 2;
  CHAIRMAN_TRANSFER_STATUS_REJECTED = 3;
  CHAIRMAN_TRANSFER_STATUS_CANCELLED = 4;
  CHAIRMAN_TRANSFER_STATUS_EXPIRED = 5;
}
enum JoinRequestSource {
  JOIN_REQUEST_SOURCE_UNSPECIFIED = 0;
  JOIN_REQUEST_SOURCE_SEARCH = 1;
  JOIN_REQUEST_SOURCE_INVITE = 2;
  JOIN_REQUEST_SOURCE_ADMIN = 3;
}
message HouseRegistration {
  string id = 1;
  string applicant_user_id = 2;
  string requested_name = 3;
  string original_address = 4;
  string city = 5;
  HouseRegistrationStatus status = 6;
  string resulting_house_id = 7;
  string rejection_reason = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp reviewed_at = 10;
  string applicant_display_name = 11;
}
message JoinRequest {
  string id = 1;
  string user_id = 2;
  string house_id = 3;
  JoinRequestSource source = 4;
  JoinRequestStatus status = 5;
  string rejection_reason = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp reviewed_at = 8;
  string display_name = 9;
}
message HouseInvitation {
  string id = 1;
  string house_id = 2;
  string created_by = 3;
  google.protobuf.Timestamp expires_at = 4;
  int32 max_uses = 5;
  int32 used_count = 6;
  InvitationStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
}
message CreatedInvitation {
  HouseInvitation invitation = 1;
  string token = 2;
  string deep_link = 3;
}
message ChairmanTransfer {
  string id = 1;
  string house_id = 2;
  string current_chairman_user_id = 3;
  string target_user_id = 4;
  ChairmanTransferStatus status = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
}
message HouseSummary {
  string id = 1;
  string name = 2;
  string address = 3;
  string city = 4;
  bool has_chairman = 5;
  bool join_available = 6;
}
message HouseMember {
  string id = 1;
  string user_id = 2;
  string house_id = 3;
  string display_name = 4;
  string role = 5;
  string status = 6;
}
message HouseAccessState {
  bool platform_admin = 1;
  int32 pending_registrations = 2;
  int32 pending_join_requests = 3;
  int32 incoming_join_requests = 4;
  bool can_manage_active_house = 5;
}
message NotificationPreferences {
  bool notifications_enabled = 1;
  bool issue_notifications_enabled = 2;
  bool announcement_notifications_enabled = 3;
  bool membership_notifications_enabled = 4;
  bool bot_notifications_enabled = 5;
}
message NotificationRecipient {
  string user_id = 1;
  string max_user_id = 2;
}
message HouseRegistrationList {
  repeated HouseRegistration items = 1;
}
message JoinRequestList {
  repeated JoinRequest items = 1;
}
message HouseInvitationList {
  repeated HouseInvitation items = 1;
}
message ChairmanTransferList {
  repeated ChairmanTransfer items = 1;
}
message HouseMemberList {
  repeated HouseMember items = 1;
}
message NotificationRecipientList {
  repeated NotificationRecipient items = 1;
}
message HouseSearchResult {
  repeated HouseSummary items = 1;
}
message CreateHouseRegistrationRequest {
  string name = 1;
  string address = 2;
  string city = 3;
}
message GetHouseRegistrationRequest {
  string id = 1;
}
message ListMyHouseRegistrationsRequest {
}
message CancelHouseRegistrationRequest {
  string id = 1;
}
message ListPendingHouseRegistrationsRequest {
}
message ApproveHouseRegistrationRequest {
  string id = 1;
  string reason = 2;
}
message RejectHouseRegistrationRequest {
  string id = 1;
  string reason = 2;
}
message SearchHousesRequest {
  string query = 1;
}
message CreateJoinRequestRequest {
  string house_id = 1;
}
message ListMyJoinRequestsRequest {
}
message CancelJoinRequestRequest {
  string id = 1;
}
message ListHouseJoinRequestsRequest {
}
message ApproveJoinRequestRequest {
  string id = 1;
  string reason = 2;
}
message RejectJoinRequestRequest {
  string id = 1;
  string reason = 2;
}
message CreateHouseInvitationRequest {
  int32 expires_in_hours = 1;
  int32 max_uses = 2;
}
message ListHouseInvitationsRequest {
}
message GetHouseInvitationRequest {
  string id = 1;
}
message RevokeHouseInvitationRequest {
  string id = 1;
}
message RedeemHouseInvitationRequest {
  string token = 1;
}
message PreviewHouseInvitationRequest {
  string token = 1;
}
message CreateChairmanTransferRequest {
  string target_user_id = 1;
}
message ListChairmanTransfersRequest {
}
message AcceptChairmanTransferRequest {
  string id = 1;
}
message RejectChairmanTransferRequest {
  string id = 1;
}
message CancelChairmanTransferRequest {
  string id = 1;
}
message ListHouseMembersRequest {
}
message DeactivateMembershipRequest {
  string id = 1;
  bool platform_admin_override = 2;
}
message ReactivateMembershipRequest {
  string id = 1;
  bool platform_admin_override = 2;
}
message RemoveMembershipRequest {
  string id = 1;
  bool platform_admin_override = 2;
}
message GetHouseAccessStateRequest {
}
message GetNotificationPreferencesRequest {
}
message UpdateNotificationPreferencesRequest {
  bool notifications_enabled = 1;
  bool issue_notifications_enabled = 2;
  bool announcement_notifications_enabled = 3;
  bool membership_notifications_enabled = 4;
  bool bot_notifications_enabled = 5;
}
message ListNotificationRecipientsRequest {
  string house_id = 1;
  string user_id = 2;
  string category = 3;
  string after_user_id = 4;
}
service HouseService {
  rpc CreateHouseRegistration(CreateHouseRegistrationRequest) returns (HouseRegistration);
  rpc GetHouseRegistration(GetHouseRegistrationRequest) returns (HouseRegistration);
  rpc ListMyHouseRegistrations(ListMyHouseRegistrationsRequest) returns (HouseRegistrationList);
  rpc CancelHouseRegistration(CancelHouseRegistrationRequest) returns (HouseRegistration);
  rpc ListPendingHouseRegistrations(ListPendingHouseRegistrationsRequest) returns (HouseRegistrationList);
  rpc ApproveHouseRegistration(ApproveHouseRegistrationRequest) returns (HouseRegistration);
  rpc RejectHouseRegistration(RejectHouseRegistrationRequest) returns (HouseRegistration);
  rpc SearchHouses(SearchHousesRequest) returns (HouseSearchResult);
  rpc CreateJoinRequest(CreateJoinRequestRequest) returns (JoinRequest);
  rpc ListMyJoinRequests(ListMyJoinRequestsRequest) returns (JoinRequestList);
  rpc CancelJoinRequest(CancelJoinRequestRequest) returns (JoinRequest);
  rpc ListHouseJoinRequests(ListHouseJoinRequestsRequest) returns (JoinRequestList);
  rpc ApproveJoinRequest(ApproveJoinRequestRequest) returns (JoinRequest);
  rpc RejectJoinRequest(RejectJoinRequestRequest) returns (JoinRequest);
  rpc CreateHouseInvitation(CreateHouseInvitationRequest) returns (CreatedInvitation);
  rpc ListHouseInvitations(ListHouseInvitationsRequest) returns (HouseInvitationList);
  rpc GetHouseInvitation(GetHouseInvitationRequest) returns (HouseInvitation);
  rpc RevokeHouseInvitation(RevokeHouseInvitationRequest) returns (HouseInvitation);
  rpc RedeemHouseInvitation(RedeemHouseInvitationRequest) returns (JoinRequest);
  rpc PreviewHouseInvitation(PreviewHouseInvitationRequest) returns (HouseSummary);
  rpc CreateChairmanTransfer(CreateChairmanTransferRequest) returns (ChairmanTransfer);
  rpc ListChairmanTransfers(ListChairmanTransfersRequest) returns (ChairmanTransferList);
  rpc AcceptChairmanTransfer(AcceptChairmanTransferRequest) returns (ChairmanTransfer);
  rpc RejectChairmanTransfer(RejectChairmanTransferRequest) returns (ChairmanTransfer);
  rpc CancelChairmanTransfer(CancelChairmanTransferRequest) returns (ChairmanTransfer);
  rpc ListHouseMembers(ListHouseMembersRequest) returns (HouseMemberList);
  rpc DeactivateMembership(DeactivateMembershipRequest) returns (HouseMember);
  rpc ReactivateMembership(ReactivateMembershipRequest) returns (HouseMember);
  rpc RemoveMembership(RemoveMembershipRequest) returns (HouseMember);
  rpc GetHouseAccessState(GetHouseAccessStateRequest) returns (HouseAccessState);
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (NotificationPreferences);
  rpc UpdateNotificationPreferences(UpdateNotificationPreferencesRequest) returns (NotificationPreferences);
  rpc ListNotificationRecipients(ListNotificationRecipientsRequest) returns (NotificationRecipientList);
}
