      "parameters":
        -
          "name": "X-Request-Id"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "page_size"
          "in": "query"
          "schema":
            "type": "integer"
            "default": 20
            "minimum": 1
            "maximum": 100
        -
          "name": "page_token"
          "in": "query"
          "schema":
            "type": "string"
          "description": "Opaque token; empty next_page_token means end."
        -
