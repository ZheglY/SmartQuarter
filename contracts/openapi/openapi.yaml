  "schemas":
    "IssueCategory":
      "type": "string"
      "enum":
        - "SAFETY"
        - "CLEANLINESS"
        - "UTILITIES"
        - "INFRASTRUCTURE"
        - "OTHER"
    "IssueStatus":
      "type": "string"
      "enum":
        - "DETECTED"
        - "CONFIRMING"
        - "READY_FOR_APPEAL"
        - "HANDED_TO_CHAIRMAN"
        - "MARKED_SENT"
        - "WAITING_RESULT"
        - "RESOLVED"
    "Issue":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "house_id":
          "type": "string"
          "format": "uuid"
        "created_by":
          "type": "string"
          "format": "uuid"
        "house_address_snapshot":
          "type": "string"
        "category":
          "$ref": "#/components/schemas/IssueCategory"
        "description":
          "type": "string"
        "location_text":
          "type": "string"
        "status":
          "$ref": "#/components/schemas/IssueStatus"
        "confirmations_count":
          "type": "integer"
          "format": "int32"
        "created_at":
          "type": "string"
          "format": "date-time"
        "updated_at":
          "type": "string"
          "format": "date-time"
        "resolved_at":
          "type":
            - "string"
            - "null"
          "format": "date-time"
      "required":
        - "id"
        - "house_id"
        - "created_by"
        - "house_address_snapshot"
        - "category"
        - "description"
        - "location_text"
        - "status"
        - "confirmations_count"
        - "created_at"
        - "updated_at"
        - "resolved_at"
    "Attachment":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "house_id":
          "type": "string"
          "format": "uuid"
        "issue_id":
          "type":
            - "string"
            - "null"
          "format": "uuid"
        "uploaded_by":
          "type": "string"
          "format": "uuid"
        "original_filename":
          "type": "string"
        "mime_type":
          "type": "string"
        "size_bytes":
          "type": "integer"
          "format": "int64"
        "sha256":
          "type": "string"
        "etag":
          "type": "string"
