openapi: 3.1.0
info:
  title: Умный Квартал API (max-gateway)
  summary: Публичный HTTP/JSON API шлюз для клиентского React Mini App внутри МАХ.
  description: |
    API Gateway проекта «Умный Квартал». Обеспечивает валидацию MAX initData, создание сессий и маршрутизацию запросов к внутренним gRPC-микросервисам.
    Реализованный функционал включает фиксацию проблем, подтверждения жителей, формирование шаблонов заявлений и функции сообщества (объявления, опросы, календарь, инициативы). Решение работает без использования ИИ.
  termsOfService: https://dev.max.ru/docs/
  contact:
    name: Команда разработки Умного Квартала
    url: https://github.com/ZheglY/SmartQuarter
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальный сервер max-gateway

tags:
  - name: Auth
    description: Сессии и авторизация МАХ
  - name: Uploads
    description: Загрузка фотографий
  - name: Issues
    description: Создание и просмотр проблем дома
  - name: Chairman
    description: Кабинет председателя и формирование заявлений
  - name: Community
    description: Объявления, опросы, календарь и инициативы
  - name: Webhook
    description: Интеграция с МАХ Bot API

security:
  - SessionAuth: []

paths:
  /api/v1/session/max:
    post:
      tags: [Auth]
      summary: Валидация MAX initData и получение сессии
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initData:
                  type: string
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        '401':
          description: MAX initData недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Профиль и memberships текущего пользователя
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'

  /api/v1/uploads:
    post:
      tags: [Uploads]
      summary: Создать сессию загрузки файла
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                mime_type:
                  type: string
                size_bytes:
                  type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_id:
                    type: string
                  presigned_url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  /api/v1/uploads/{id}/complete:
    post:
      tags: [Uploads]
      summary: Подтвердить окончание загрузки файла
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'

  /api/v1/issues:
    post:
      tags: [Issues]
      summary: Создать проблему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                description:
                  type: string
                location_text:
                  type: string
                attachment_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
    get:
      tags: [Issues]
      summary: Список проблем активного дома
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'

  /api/v1/issues/{id}:
    get:
      tags: [Issues]
      summary: Карточка проблемы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetails'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/issues/{id}/confirm:
    post:
      tags: [Issues]
      summary: Подтвердить проблему
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmation_count:
                    type: integer
                  confirmed_by_me:
                    type: boolean
        '409':
          description: Конфликт - повторное подтверждение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/issues/{id}/status:
    patch:
      tags: [Issues]
      summary: Изменить статус с проверкой роли и стейт-машины
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/IssueStatus'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'

  /api/v1/chairman/issues:
    get:
      tags: [Chairman]
      summary: Очередь проблем председателя
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '403':
          description: Недостаточно прав (требуется роль CHAIRMAN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/issues/{id}/statement:
    post:
      tags: [Chairman]
      summary: Сформировать или обновить шаблон заявления
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chairman_note:
                  type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementDraft'

  /api/v1/attachments/{id}/download-url:
    get:
      tags: [Uploads]
      summary: Получить короткоживущий URL для скачивания файла
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  /webhooks/max:
    post:
      tags: [Webhook]
      summary: Обработка событий webhook от MAX Bot API
      security: []
      responses:
        '200':
          description: Успешно обработано идемпотентно

  /api/v1/announcements:
    post:
      tags: [Community]
      summary: Создать объявление председателем
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
    get:
      tags: [Community]
      summary: Список объявлений активного дома
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementList'

  /api/v1/polls:
    post:
      tags: [Community]
      summary: Создать опрос
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                options:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
    get:
      tags: [Community]
      summary: Список опросов
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollList'

  /api/v1/polls/{id}:
    get:
      tags: [Community]
      summary: Получить опрос и результаты
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollDetails'

  /api/v1/polls/{id}/vote:
    post:
      tags: [Community]
      summary: Проголосовать один раз
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                option_id:
                  type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/v1/calendar/events:
    get:
      tags: [Community]
      summary: Список событий календаря
      responses:
        '200':
          description: Успешно
    post:
      tags: [Community]
      summary: Создать событие дома
      responses:
        '200':
          description: Успешно

  /api/v1/initiatives:
    post:
      tags: [Community]
      summary: Создать инициативу
      responses:
        '200':
          description: Успешно

  /api/v1/initiatives/{id}/support:
    post:
      tags: [Community]
      summary: Поддержать инициативу
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешно

components:
  securitySchemes:
    SessionAuth:
      type: http
      scheme: bearer
      description: Короткоживущий токен сессии (или Cookie), выдаваемый Gateway.

  schemas:
    ErrorResponse:
      type: object
      description: Единый формат ошибок (HTTP error envelope)
      required:
        - error
        - request_id
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Внутренний код ошибки
            message:
              type: string
              description: Описание ошибки
        request_id:
          type: string
          description: Идентификатор запроса для логов

    UserContext:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            max_user_id:
              type: integer
            display_name:
              type: string
        houses:
          type: array
          items:
            type: object
            properties:
              house_id:
                type: string
              role:
                type: string
                enum: [RESIDENT, CHAIRMAN, ADMIN]
        default_house_id:
          type: string

    Attachment:
      type: object
      properties:
        id:
          type: string
        issue_id:
          type: string
        object_key:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    IssueStatus:
      type: string
      enum:
        - DETECTED
        - CONFIRMING
        - READY_FOR_APPEAL
        - HANDED_TO_CHAIRMAN
        - MARKED_SENT
        - WAITING_RESULT
        - RESOLVED
      description: Разрешенные статусы проблемы

    Issue:
      type: object
      properties:
        id:
          type: string
        house_id:
          type: string
        created_by:
          type: string
        category:
          type: string
        description:
          type: string
        location_text:
          type: string
        status:
          $ref: '#/components/schemas/IssueStatus'
        confirmations_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    IssueList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        next_page_token:
          type: string

    IssueDetails:
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          properties:
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            timeline:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  created_at:
                    type: string
                    format: date-time

    StatementDraft:
      type: object
      properties:
        id:
          type: string
        issue_id:
          type: string
        version:
          type: integer
        status:
          type: string
        body:
          type: string
        chairman_note:
          type: string
        created_at:
          type: string
          format: date-time

    Announcement:
      type: object
      properties:
        id:
          type: string
        house_id:
          type: string
        title:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time

    AnnouncementList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        next_page_token:
          type: string

    Poll:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    PollList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Poll'
        next_page_token:
          type: string

    PollDetails:
      allOf:
        - $ref: '#/components/schemas/Poll'
        - type: object
          properties:
            options:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  text:
                    type: string
                  votes_count:
                    type: integer
