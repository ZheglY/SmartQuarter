"openapi": "3.1.0"
"info":
  "title": "SmartQuarter max-gateway"
  "version": "1.1.0"
  "description": "Gateway API with real Identity, Issue and Community services. Session actor and active house are server-owned. House registration requires explicit platform administrator approval. Stable HTTP errors map gRPC status codes."
"servers":
  -
    "url": "http://localhost:18080"
"security":
  -
    "SessionAuth": []
"paths":
  "/api/v1/session/max":
    "post":
      "summary": "Validate MAX and create Redis session"
      "operationId": "post__api_v1_session_max"
      "description": "gRPC: Identity.UpsertMaxUser -> GetUserContext -> GetMembership. Real Identity integration. Users without membership can access house onboarding. Cookie is HttpOnly, Path=/; production Secure + SameSite=None; local Lax."
      "responses":
        "200":
          "description": "Success"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "413":
          "$ref": "#/components/responses/Error413"
        "415":
          "$ref": "#/components/responses/Error415"
        "429":
          "$ref": "#/components/responses/Error429"
        "500":
          "$ref": "#/components/responses/Error500"
        "502":
          "$ref": "#/components/responses/Error502"
        "503":
          "$ref": "#/components/responses/Error503"
        "504":
          "$ref": "#/components/responses/Error504"
        "408":
          "$ref": "#/components/responses/Error408"
      "parameters":
        -
          "name": "X-Request-Id"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "Origin"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
            "format": "uri"
          "description": "Exact origin from TRUSTED_ORIGINS. Missing or foreign Origin is rejected (CSRF protection)."
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "additionalProperties": false
              "properties":
                "init_data":
                  "type": "string"
              "required":
                - "init_data"
            "example":
              "init_data": "<raw MAX initData>"
