name: smartquarter

# Development only: public entry point is max-gateway.
# Databases, Redis and S3 will be added with the corresponding adapters.
services:
  max-gateway:
    build:
      context: ../services/max-gateway
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  identity-service:
    build:
      context: ../services/identity-service
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  issue-service:
    build:
      context: ../services/issue-service
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  community-service:
    build:
      context: ../services/community-service
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.0
    ports:
      - "8085:8080"
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - ../contracts/openapi/openapi.yaml:/openapi/openapi.yaml:ro
