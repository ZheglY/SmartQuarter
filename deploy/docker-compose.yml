name: smartquarter

# Development only: public entry point is max-gateway.
# Databases, Redis and S3 will be added with the corresponding adapters.
services:
  max-gateway:
    build:
      context: ../services/max-gateway
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  identity-service:
    build:
      context: ../services/identity-service
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  issue-service:
    build:
      context: ../services/issue-service
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  community-service:
    build:
      context: ../services/community-service
      dockerfile: Dockerfile
    environment:
      - HTTP_ADDR=:8084
      # ИСПРАВЛЕНО: Теперь сервис контейнера подключается к базе postgres
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    ports:
      - "9090:9090"
    expose:
      - "8084"
      - "9090"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres # Оставляем целевой базой дефолтную postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Сюда маппятся миграции, они автоматически выполнятся внутри базы postgres при первом запуске
      - ../services/community-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # ИСПРАВЛЕНО: Хелсчек проверяет готовность базы postgres
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.0
    ports:
      - "8085:8080"
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - ../contracts/openapi/openapi.yaml:/openapi/openapi.yaml:ro

volumes:
  postgres_data:
