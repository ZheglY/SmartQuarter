name: smartquarter

# Development only: public entry point is max-gateway.
# Full application stack: deploy/server/compose.yaml; isolated tests: deploy/test/compose.yaml.
services:
  max-gateway:
    build:
      context: ../services/max-gateway
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    # Ubuntu CA trust mount is configured in deploy/server/compose.yaml.

  identity-service:
    build:
      context: ../services/identity-service
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  issue-service:
    build:
      context: ../services/issue-service
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  community-service:
    build:
      context: ../services/community-service
      dockerfile: Dockerfile
    # Подключаем файл с переменными окружения
    env_file:
      - ../services/community-service/.env
    environment:
      # Переопределяем только критичные строки, если они не заданы в .env
      - HTTP_ADDR=${HTTP_ADDR:-:8084}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@community_postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis://community_redis:6379/0}
    ports:
      - "${APP_PORT:-8084}:8084" # HTTP
      - "${GRPC_PORT:-9090}:9090" # gRPC
    init: true
    stop_grace_period: 15s
    depends_on:
      community_postgres:
        condition: service_healthy
      community_redis:
        condition: service_healthy

  community_postgres:
    image: postgres:15-alpine
    container_name: community_postgres
    restart: always
    env_file:
      - ../services/community-service/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Монтируем миграции (накатятся при первом старте пустой базы)
      - ../services/community-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  community_redis:
    image: redis:7-alpine
    container_name: community_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.0
    ports:
      - "8085:8080"
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - ../contracts/openapi/openapi.yaml:/openapi/openapi.yaml:ro

volumes:
  postgres_data:
