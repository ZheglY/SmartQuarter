name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: house-ci-only
          POSTGRES_DB: ${{ matrix.service == 'community-service' && 'community_test' || 'identity_test_house' }}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 2s --health-timeout 3s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        service: [community-service, identity-service, issue-service, max-gateway]
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
      HOUSE_TEST_DATABASE_URL: ${{ matrix.service == 'identity-service' && 'postgres://test:house-ci-only@localhost:5432/identity_test_house?sslmode=disable' || '' }}
      COMMUNITY_TEST_DATABASE_URL: ${{ matrix.service == 'community-service' && 'postgres://test:house-ci-only@localhost:5432/community_test?sslmode=disable' || '' }}
      COMMUNITY_TEST_MIGRATE: '1'
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Check formatting and module metadata
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
          go mod tidy -diff
          go mod verify
      - run: go vet ./...
      - run: go test ./...

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/max-gateway/go.mod
          cache-dependency-path: services/max-gateway/go.sum
      - name: Validate protobuf contracts
        env:
          GOWORK: 'off'
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          buf lint contracts/proto
      - name: Validate OpenAPI
        run: |
          python3 -m pip install --disable-pip-version-check openapi-spec-validator==0.9.0
          python3 services/max-gateway/scripts/openapi.py
          python3 -m openapi_spec_validator contracts/openapi/openapi.yaml
          git diff --exit-code -- contracts/openapi/openapi.yaml
      - name: Validate DATA-API submission
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/data-api/requirements.txt
          python3 tools/data-api/validate_data_api.py DATA-API.yaml --openapi contracts/openapi/openapi.yaml

  frontend:
    name: Mini App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/miniapp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/miniapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          path: |
            web/miniapp/playwright-report/
            web/miniapp/test-results/
          retention-days: 7

  images:
    name: Docker (${{ matrix.context }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        context:
          - services/community-service
          - services/identity-service
          - services/issue-service
          - services/max-gateway
          - web/miniapp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build deployable image
        run: docker build "${{ matrix.context }}"

  acceptance:
    name: Application workflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build acceptance stack
        run: docker compose -f deploy/test/compose.yaml build
      - name: Real Identity, Issue, Community, PostgreSQL, Redis and S3 workflow
        run: docker compose -f deploy/test/compose.yaml run --rm test
      - name: Operator provisioning and access revocation
        run: bash deploy/test/check-provision.sh
      - name: Diagnostics
        if: failure()
        run: docker compose -f deploy/test/compose.yaml logs --tail=150
      - name: Clean isolated stack
        if: always()
        run: docker compose -f deploy/test/compose.yaml down -v

  ci:
    name: CI
    if: always()
    needs: [go, contracts, frontend, images, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          GO_RESULT: ${{ needs.go.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          test "$GO_RESULT" = success
          test "$CONTRACTS_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$IMAGES_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success
